<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>智能闸口 · 星辰粒子</title>
<style>
*{box-sizing:border-box}body{margin:0;color:#e5f7ff;font:13px system-ui;overflow:hidden}canvas{display:block;width:100vw;height:100svh;touch-action:none;background:radial-gradient(ellipse at 54% 52%,#386681,#244d68 45%,#152c46)}header{position:fixed;top:7%;left:6%;pointer-events:none}small{letter-spacing:.3em;color:#acd6e6}h1{font-size:clamp(24px,3.3vw,48px);font-weight:400;letter-spacing:.12em;margin:14px 0}header p{color:#b8d4e2;letter-spacing:.15em}.controls{position:fixed;bottom:28px;left:6%;right:6%;display:flex;align-items:center;gap:8px}.hint{margin-left:auto;color:#aacddd}button{font:inherit;border:1px solid #a3d7ed40;border-radius:24px;color:#d5f0fa;background:#254c6577;padding:10px 17px;cursor:pointer;backdrop-filter:blur(12px)}button:hover{background:#5e93ad66}:focus-visible{outline:2px solid #d6f9ff;outline-offset:-3px}@media(max-width:600px){.hint{display:none}.controls{bottom:18px}}
</style>
<canvas tabindex="0" role="img" aria-label="星辰粒子构成三维堆场与智能闸口，移动鼠标扰动，点击发送脉冲，空格暂停"></canvas>
<header><small>SMART GATE / DIGITAL YARD</small><h1>让每一次通行，智慧发生。</h1><p>星辰粒子 · 智能闸口背景概念</p></header>
<div class="controls"><button id="morph">散入星海</button><button id="pause" aria-pressed="false">暂停</button><button id="clean">纯背景</button><span class="hint">移动鼠标扰动星辰 · 点击唤起脉冲</span></div>
<script>
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),reduced=matchMedia('(prefers-reduced-motion: reduce)');
let width=0,height=0,time=0,last=0,raf=0,paused=reduced.matches,scattered=false,morph=0,pulse=-20;
const pointer={x:-9999,y:-9999},camera={x:0,y:0},points=[],stars=[];
let seed=307;function random(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}
function dot(x,y,z,type=0){points.push({x,y,z,type,phase:random()*6.283,size:.55+random()*.75,sx:(random()-.5)*1500,sy:(random()-.5)*760,sz:(random()-.5)*700})}
function segment(a,b,type=0,step=7){const count=Math.ceil(Math.hypot(...a.map((n,i)=>n-b[i]))/step);for(let i=0;i<=count;i++)dot(...a.map((n,j)=>n+(b[j]-n)*i/count),type)}
function box(x,y,z,w,h,d,type=0){const p=[[x,y,z],[x+w,y,z],[x+w,y+h,z],[x,y+h,z],[x,y,z+d],[x+w,y,z+d],[x+w,y+h,z+d],[x,y+h,z+d]];for(const[a,b]of[[0,1],[1,2],[2,3],[3,0],[4,5],[5,6],[6,7],[7,4],[0,4],[1,5],[2,6],[3,7]])segment(p[a],p[b],type)}
function container(x,y,z){box(x,y,z,114,46,170);for(let i=9;i<114;i+=11)segment([x+i,y,z],[x+i,y+46,z],0,9);for(let i=12;i<170;i+=17)segment([x+114,y,z+i],[x+114,y+46,z+i],0,10)}
for(const side of[-1,1])for(let row=0;row<3;row++)for(let stack=0;stack<2;stack++)for(let col=0;col<2;col++)container(side<0?-540+col*124:290+col*124,stack*49,70+row*195);
// Gate structure, OCR cameras, kiosks, and barrier arms are real 3D point geometry.
for(const x of[-235,0,235])box(x-3,0,-90,6,215,6,1);segment([-235,215,-90],[235,215,-90],1,3);
for(const c of[-118,118]){box(c-45,215,-90,90,35,3,1);for(const o of[-66,0,66])box(c+o-5,211,-96,10,9,12,2);box(c-105,0,-48,30,61,45,1);box(c-103,28,-49,26,24,2,2);box(c+77,0,-123,8,33,8,1);segment([c+81,32,-120],[c-45,32,-120],2,4);for(const o of[-89,89])segment([c+o,0,-350],[c+o,0,650],0,12)}
for(const x of[-220,0,220])segment([x,0,210],[x,164,210],0,10);segment([-220,164,210],[220,164,210],0,8);
box(28,0,60,58,48,70,1);box(25,20,130,64,63,144);box(33,30,57,48,14,3,2);
for(let i=0;i<700;i++)dot((random()-.5)*1250,-3,random()*900-300,3);
for(let i=0;i<260;i++)stars.push({x:random(),y:random(),r:.35+random()*1.1,p:random()*7});
function resize(){width=innerWidth;height=innerHeight;const dpr=Math.min(devicePixelRatio||1,2);canvas.width=width*dpr;canvas.height=height*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);draw()}
function project(x,y,z){const yaw=-.17+camera.x*.075,cs=Math.cos(yaw),sn=Math.sin(yaw),xx=x*cs+z*sn,zz=z*cs-x*sn,tilt=.34+camera.y*.03,yy=-y*Math.cos(tilt)-zz*Math.sin(tilt),depth=zz*Math.cos(tilt)-y*Math.sin(tilt),s=1050/(1250+depth)*Math.min(width/1150,height/680);return{x:width*.52+xx*s,y:height*.69+yy*s,s}}
function draw(){ctx.clearRect(0,0,width,height);ctx.globalCompositeOperation='lighter';for(const star of stars){ctx.fillStyle=`rgba(202,239,255,${.15+.24*(.5+.5*Math.sin(time*.5+star.p))})`;ctx.beginPath();ctx.arc((star.x*width+Math.sin(time*.025+star.p)*9+width)%width,star.y*height,star.r,0,7);ctx.fill()}
 const projected=[];for(const p of points){const out=project(p.x*(1-morph)+p.sx*morph,p.y*(1-morph)+p.sy*morph+Math.sin(time*.7+p.phase)*1.5,p.z*(1-morph)+p.sz*morph),dx=out.x-pointer.x,dy=out.y-pointer.y,distance=Math.hypot(dx,dy);if(distance<100&&distance>0){const push=(1-distance/100)**2*22;out.x+=dx/distance*push;out.y+=dy/distance*push}
 const ring=Math.abs(Math.hypot(p.x,p.z+90)-(time-pulse)*340),shine=ring<28?1-ring/28:0,a=(p.type===3?.2:p.type===1?.82:.5)*(.72+.28*Math.sin(time*.75+p.phase))+shine*.5;
 ctx.fillStyle=p.type===2?`rgba(174,250,255,${Math.min(1,a+.2)})`:`rgba(191,225,249,${Math.min(1,a)})`;const r=Math.max(.45,p.size*out.s)+(p.type===2?.45:0)+shine*.65;ctx.beginPath();ctx.arc(out.x,out.y,r,0,7);ctx.fill();if((p.type===2||shine>.5)&&out.s>.25){ctx.fillStyle=`rgba(117,222,255,${.07+shine*.06})`;ctx.beginPath();ctx.arc(out.x,out.y,r*4,0,7);ctx.fill()}if(p.type===1)projected.push(out)}
 ctx.lineWidth=.5;ctx.strokeStyle=`rgba(168,229,255,${.14*(1-morph)})`;ctx.beginPath();for(let i=1;i<projected.length;i++){const a=projected[i-1],b=projected[i];if(Math.hypot(a.x-b.x,a.y-b.y)<13){ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y)}}ctx.stroke();
 if(morph<.8){const z=450-(time*65%800);for(const x of[-175,-60,60,175]){const a=project(x,1,z),b=project(x,1,z+32);ctx.strokeStyle=`rgba(157,249,255,${.45*(1-morph)})`;ctx.lineWidth=1.3;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()}}ctx.globalCompositeOperation='source-over'}
function tick(now){const dt=Math.min((now-last)/1000,.04);last=now;if(!paused){time+=dt;morph+=(Number(scattered)-morph)*Math.min(1,dt*1.4);camera.x+=((pointer.x<0?0:pointer.x/width-.5)-camera.x)*dt*2;camera.y+=((pointer.y<0?0:pointer.y/height-.5)-camera.y)*dt*2;draw()}raf=requestAnimationFrame(tick)}
function sync(){document.querySelector('#pause').textContent=paused?'播放':'暂停';document.querySelector('#pause').setAttribute('aria-pressed',String(paused))}
document.querySelector('#pause').onclick=()=>{paused=!paused;sync()};document.querySelector('#morph').onclick=()=>{scattered=!scattered;document.querySelector('#morph').textContent=scattered?'聚成闸口':'散入星海';if(paused){morph=Number(scattered);draw()}};
document.querySelector('#clean').onclick=()=>{const el=document.querySelector('header');el.hidden=!el.hidden;document.querySelector('#clean').textContent=el.hidden?'显示文案':'纯背景'};
canvas.addEventListener('pointermove',e=>{pointer.x=e.clientX;pointer.y=e.clientY;if(paused)draw()});canvas.addEventListener('pointerleave',()=>{pointer.x=-9999;pointer.y=-9999});canvas.addEventListener('click',()=>{pulse=time;scattered=false;document.querySelector('#morph').textContent='散入星海';if(paused){morph=0;draw()}});
canvas.addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='KeyP'){e.preventDefault();paused=!paused;sync()}if(e.code==='Enter')pulse=time});reduced.addEventListener('change',e=>{paused=e.matches;sync()});document.addEventListener('visibilitychange',()=>{cancelAnimationFrame(raf);if(!document.hidden){last=performance.now();raf=requestAnimationFrame(tick)}});addEventListener('resize',resize);resize();sync();raf=requestAnimationFrame(tick);
</script></html>
