# 部署前确认 SSL 证书同时覆盖 shouhuikeji.com 和 www.shouhuikeji.com。
server {
    listen 80;
    server_name shouhuikeji.com www.shouhuikeji.com;

    location ^~ /.well-known/acme-challenge/ {
        root /opt/apps/gateway/acme-challenge;
    }

    location / {
        return 301 https://www.shouhuikeji.com$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name shouhuikeji.com;

    ssl_certificate     /etc/nginx/certs/www.shouhuikeji.com_ecc/fullchain.cer;
    ssl_certificate_key /etc/nginx/certs/www.shouhuikeji.com_ecc/www.shouhuikeji.com.key;

    return 301 https://www.shouhuikeji.com$request_uri;
}

server {
    listen 443 ssl;
    server_name www.shouhuikeji.com;

    ssl_certificate     /etc/nginx/certs/www.shouhuikeji.com_ecc/fullchain.cer;
    ssl_certificate_key /etc/nginx/certs/www.shouhuikeji.com_ecc/www.shouhuikeji.com.key;

    root /opt/apps/website/frontend/dist;
    index index.html;

    # 首页是唯一保留尾部 / 的页面。
    location = / {
        try_files /index.html =404;
    }

    # 公开页面统一为无尾斜杠 URL；不影响 /api/ 和 /uploads/。
    location ~ ^(/(?:solutions|products|cases|news|about|contact)(?:/[^/]+)*)/$ {
        return 301 https://www.shouhuikeji.com$1$is_args$args;
    }

    # 构建产物为 /path/index.html；优先匹配该文件，避免 Nginx 将 /path 301 到 /path/。
    location / {
        try_files $uri/index.html $uri =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    location /uploads/ {
        alias /opt/apps/website/uploads/;
    }

    location /api/ {
        resolver 127.0.0.11 valid=10s;
        set $backend http://website-backend:8080;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
